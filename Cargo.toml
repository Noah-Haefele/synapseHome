[package]
name = "synapsed"
version = "0.1.0"
edition = "2024"

# Dependencies shared by ALL binaries:
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
hostname = "0.4.2"
rumqttc = "0.25.1"
tokio-stream = "0.1.19"
local-ip-address = "0.6.13"
cpal = "0.18.2"
ringbuf = "0.5.1"
rodio = "0.22.2"
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }

# Optional dependencies used ONLY by touch_device (gRPC / UI interface):
tonic = { version = "*", optional = true }
prost = { version = "0.14", optional = true }
tonic-prost = { version = "*", optional = true }
sonora = { version = "*", optional = true }

[features]
default = ["touch_device"]
touch_device = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:sonora"]
door_device = []

[build-dependencies]
tonic-prost-build = "*"

[[bin]]
name = "touch_device"
path = "src/bin/touch_device.rs"
required-features = ["touch_device"]

[[bin]]
name = "door_device"
path = "src/bin/door_device.rs"
required-features = ["door_device"]
