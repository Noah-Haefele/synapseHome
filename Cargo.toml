[package]
name = "synapsed"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
tonic = "*"
prost = "0.14"
tonic-prost = "*"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
hostname = "0.4.2"

[build-dependencies]
tonic-prost-build = "*"
